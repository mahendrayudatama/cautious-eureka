global:
  resolve_timeout: 5m

route:
  receiver: teams-notifications
  group_by: ["alertname", "namespace"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
- name: teams-notifications
  webhook_configs:
  - url: "https://outlook.office.com/webhook/REPLACE_ME"
    send_resolved: true
