apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-not-ready-alert
  namespace: openshift-monitoring
spec:
  groups:
  - name: pod-health.rules
    rules:
    - alert: PodNotReady
      expr: |
        kube_pod_status_ready{condition="true"} == 0
        unless kube_pod_status_phase{phase="Succeeded"} == 1
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Pod is not Ready"
        description: |
          Pod {{ $labels.pod }} in namespace {{ $labels.namespace }}
          has been not Ready for more than 2 minutes.
